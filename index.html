
<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202820">
<title>MY TODO</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 30px 18px;
  background: #f3f3ee;
  color: #292e29;
  font-family: sans-serif;
}
main {
  max-width: 560px;
  margin: auto;
}
header {
  padding: 25px 0;
  border-bottom: 2px solid #292e29;
}
h1 {
  font-size: 30px;
  letter-spacing: 3px;
  margin: 0;
}
.subtitle {
  color: #777;
  font-size: 12px;
  letter-spacing: 2px;
  margin-top: 8px;
}
.count {
  margin: 25px 0 15px;
  color: #777;
  font-size: 14px;
}
form {
  display: flex;
  gap: 8px;
}
input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  font-size: 16px;
}
button {
  border: none;
  border-radius: 6px;
  padding: 12px 16px;
  background: #293b30;
  color: white;
  cursor: pointer;
  font-size: 14px;
}
ul {
  list-style: none;
  padding: 0;
  margin-top: 25px;
}
li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 5px;
  border-bottom: 1px solid #ddd;
}
li span {
  flex: 1;
  overflow-wrap: anywhere;
}
li.done span {
  color: #999;
  text-decoration: line-through;
}
li input[type="checkbox"] {
  flex: none;
  width: 19px;
  height: 19px;
}
li button {
  padding: 8px 10px;
  background: #e5e5df;
  color: #333;
}
li button.delete {
  color: #9b4545;
}
.empty {
  text-align: center;
  color: #999;
  padding: 40px 0;
}

/* 経験値獲得エフェクト */
.xp-effect {
  color: #d69b35;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  opacity: 0;
  pointer-events: none;
}

.xp-effect.show {
  animation: xpPop 1.2s ease-out;
}

@keyframes xpPop {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.7);
  }
  25% {
    opacity: 1;
    transform: translateY(0) scale(1.2);
  }
  70% {
    opacity: 1;
    transform: translateY(-8px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-18px) scale(1);
  }
}
</style>
</head>
<body>
<main>
<header>
<h1>MY TODO</h1>
<div class="subtitle">YOUR DAILY TASKS</div>
</header>

<section class="experience">
  <div class="level">LEVEL 1</div>
  <div class="xp" id="xp">0 XP</div>
  <div class="xp-message">宝石を育てよう！</div>

  <button id="loginBonus">🎁 ボーナスを受け取る</button>

  <div class="xp-effect" id="xpEffect"></div>
</section>

<div class="count" id="count">0 TASKS</div>
<form id="form">
<input id="taskInput" type="text"
placeholder="新しいタスクを入力..." required>

<select id="taskPriority">
  <option value="normal">普通</option>
  <option value="important">重要</option>
  <option value="top">最重要</option>
</select>

<button type="submit">追加</button>
</form>

<ul id="taskList"></ul>
</main>

<script>
let tasks = JSON.parse(
  localStorage.getItem("myTodoTasks") || "[]"
);
tasks.forEach(task => {
  if (typeof task.xpClaimed !== "boolean") {
    task.xpClaimed = task.done;
  }
});

let experience = Number(
  localStorage.getItem("myTodoXP") || "0"
);

// 経験値の獲得履歴を読み込む
let xpHistory = JSON.parse(
  localStorage.getItem("myTodoXPHistory") || "[]"
);

const form = document.getElementById("form");
const input = document.getElementById("taskInput");
const list = document.getElementById("taskList");
const count = document.getElementById("count");
const xpDisplay = document.getElementById("xp");
const xpEffect = document.getElementById("xpEffect");
const loginBonus = document.getElementById("loginBonus");

// XP獲得エフェクトを表示する関数
function showXpEffect(message) {
  xpEffect.textContent = message;
  xpEffect.classList.remove("show");
  void xpEffect.offsetWidth;
  xpEffect.classList.add("show");
}

// 毎日のログインボーナス
const today = new Date().toLocaleDateString("sv-SE");
const loginKey = `login_${today}`;

// ボーナス受け取りボタン
if (xpHistory.includes(loginKey)) {
  loginBonus.textContent = "🎁 また明日！";
  loginBonus.disabled = true;
}

loginBonus.addEventListener("click", () => {
  if (xpHistory.includes(loginKey)) return;

  experience += 30;
  xpHistory.push(loginKey);

  showXpEffect("DAILY BONUS ＋30 XP！");

  loginBonus.textContent = "🎁 また明日！";
  loginBonus.disabled = true;

  save();
});

function save() {
  localStorage.setItem("myTodoTasks", JSON.stringify(tasks));
  localStorage.setItem("myTodoXP", String(experience));
  localStorage.setItem("myTodoXPHistory", JSON.stringify(xpHistory));
  render();
}

function render() {
  list.innerHTML = "";
  const remaining = tasks.filter(t => !t.done).length;
  count.textContent = `${remaining} / ${tasks.length} TASKS REMAINING`;

  xpDisplay.textContent = `${experience} XP`;

  if (tasks.length === 0) {
    list.innerHTML = '<li class="empty">タスクはありません</li>';
    return;
  }

  tasks.forEach(task => {
    const li = document.createElement("li");
    if (task.done) li.classList.add("done");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = task.done;
    
  check.addEventListener("change", () => {
  const today = new Date().toLocaleDateString("sv-SE");
  const historyKey = `${task.text.trim()}_${today}`;

  if (check.checked && !xpHistory.includes(historyKey)) {
  experience += 10;
  xpHistory.push(historyKey);
  showXpEffect("＋10 XP！");
}

  task.done = check.checked;
  save();
});
    const name = document.createElement("span");
    name.textContent = task.text;

    const edit = document.createElement("button");
    edit.textContent = "編集";
    edit.addEventListener("click", () => {
      const value = prompt("タスクを編集", task.text);
      if (value !== null && value.trim()) {
        task.text = value.trim();
        save();
      }
    });

    const del = document.createElement("button");
    del.textContent = "削除";
    del.className = "delete";
    del.addEventListener("click", () => {
      if (confirm("このタスクを削除しますか？")) {
        tasks = tasks.filter(t => t.id !== task.id);
        save();
      }
    });

    li.append(check, name, edit, del);
    list.appendChild(li);
  });
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  tasks.push({
    id: Date.now(),
    text: text,
    done: false
  });

  input.value = "";
  save();
});

render();
</script>
</body>
</html>
